#
# Builds the site in site/ and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "skills/*/SKILL.md"
      - "docs/autopilot-flow.html"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "skills/*/SKILL.md"
      - "docs/autopilot-flow.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pull requests: fail if a skill has no site entry, or the entry no longer matches its SKILL.md.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/tools/build.py --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate skill data and walkthrough
        run: python3 site/tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
