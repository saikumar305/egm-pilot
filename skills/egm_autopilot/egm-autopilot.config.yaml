# egm-autopilot defaults. Copy to your repo root to override per project.

jira:
  ready_label: ai-ready              # tickets the autopilot may pick up
  needs_input_label: ai-needs-input
  spec_gate_label: ai-awaiting-spec-approval
  in_review_status: "In Review"      # transition target after MR is raised
  high_priority_values: [Highest, Blocker]

readiness:
  park_below: 40                     # <40: park with questions, do not start
  proceed_above: 70                  # 40-70: proceed, recording gaps as Assumptions

lanes:
  small: { max_files: 3 }
  high:  { min_modules: 3, min_files: 15 }

loops:
  spec_max_rounds: 3
  code_max_rounds: 2
  fix_max_attempts: 3
on_cap_exceeded:
  spec: park                         # never build on a failed spec
  code: draft_mr                     # show humans the work + unresolved findings

checks:                          # run in the worktree. Override per target repo in its own
                                   # egm-autopilot.config.yaml. If a key is empty, detect from
                                   # Makefile / package.json / pyproject / CI config; if nothing
                                   # is detectable, record "no check available" (never claim pass).
  build:       ""
  lint:        ""
  typecheck:   ""
  test:        ""
  secret_scan: ""                  # e.g. "gitleaks detect --no-banner"; skipped if tool missing

git:
  branch_prefix: "ai/"
  protected_branches: [main, master, develop, release]
  mr_tool: glab                      # runs as the logged-in developer; no bot account

mr:
  draft: true                        # MRs open as Draft so the developer owns the publish step

gates:                               # stop for the developer's approval before a step (SKILL.md, Gates)
  commit: auto                       # auto | ask. ask: approve each unit's commits (interactive only)
  push:   auto                       # auto | ask. ask: nothing is pushed until you approve
  mr:     auto                       # auto | ask. ask: no MR is opened until you approve
                                     # Interactive always asks for push and mr. The guard hook
                                     # blocks a gated step that has no recorded approval.

repos: {}                            # optional names for --repos; the per-user home (~/.egm/workspace.yaml, via /egm-pilot:egm-init) takes precedence
  # name: { path: ~/code/name, role: backend|client|frontend|tests|shared|infra|docs|other, checks: { test: "..." } }
  # Example:
  # orders-api: { path: ~/code/orders-api, role: backend }
  # web-app:    { path: ~/work/web-app,    role: frontend }

multi_repo:                          # opt-in: only repos you attach with --repos are changed
  suggest: true                      # list other likely affected repos as follow-ups; never attaches them
  max_repos: 4                       # including the primary; more means the ticket is too broad

units:                               # see references/units.md
  max: 5                             # more units than this: the ticket is too big, park and propose a split
  max_files_per_unit: 8
  mr_strategy: stacked               # stacked | single (small lane is always single)

budgets:                             # hard ceilings per ticket; park when exceeded
  max_minutes: 60
  max_files_changed: 40
